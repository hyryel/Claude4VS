<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- img-src sans https: : une image distante dans une réponse serait chargée sans clic (canal d'exfiltration) ; les captures collées sont en data: -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'none'">
  <title>Claude</title>
  <link rel="icon" href="data:,"> <!-- évite la requête favicon.ico (erreur 404 en console) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <label class="field"><span>Modèle</span>
      <select id="model" title="Modèle">
        <option value="">Par défaut</option>
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
        <option value="haiku">Haiku</option>
      </select>
    </label>
    <label class="field"><span>Effort</span>
      <select id="effort" title="Niveau de réflexion">
        <option value="">Par défaut</option>
        <option value="low">Faible</option>
        <option value="medium">Moyen</option>
        <option value="high">Élevé</option>
        <option value="xhigh">Maximal</option>
      </select>
    </label>
    <label class="field"><span>Permissions</span>
      <select id="mode" title="Mode de permission">
        <option value="default">Demander</option>
        <option value="acceptEdits">Accepter les modifications</option>
        <option value="plan">Plan</option>
        <option value="bypassPermissions">Tout autoriser</option>
      </select>
    </label>
    <span class="spacer"></span>
    <span class="actions">
      <button id="history" class="icon" title="Conversations précédentes" aria-label="Conversations précédentes" data-icon="history"></button>
      <button id="newChat" class="icon" title="Nouvelle conversation" aria-label="Nouvelle conversation" data-icon="plus"></button>
    </span>
  </header>

  <div id="banner" role="status" hidden>
    <span id="bannerText"></span>
    <button id="closeBanner" class="icon" title="Fermer" aria-label="Fermer l'annonce" data-icon="close"></button>
  </div>

  <div id="sessions" hidden>
    <div class="sessions-head">Conversations récentes <button id="closeSessions" class="icon" aria-label="Fermer la liste des conversations" data-icon="close"></button></div>
    <div id="sessionList"></div>
  </div>

  <main id="messages">
    <div id="welcome">
      <h2>Claude</h2>
      <p>Posez une question ou demandez une modification. La sélection courante de l'éditeur est jointe automatiquement (puce <span data-icon="clip"></span>ci-dessous).</p>
      <p class="hint">Entrée pour envoyer · Maj+Entrée pour un saut de ligne · <code>/</code> pour les commandes</p>
    </div>
  </main>

  <footer id="composer">
    <div id="statusLine">
      <span id="activity"><span id="status"></span><button id="stop" hidden title="Interrompre Claude"><span class="sq"></span>Arrêter</button></span>
      <button id="agents" hidden title="Aller à l'agent en cours"></button>
      <span class="spacer"></span>
      <span id="context" hidden title="">
        <span class="bar"><span class="fill"></span></span>
        <span class="pct"></span>
        <button id="compact" class="icon" title="Compacter le contexte (/compact)" aria-label="Compacter le contexte" data-icon="compact"></button>
      </span>
    </div>
    <div id="slash" role="listbox" aria-label="Suggestions" hidden></div>
    <div id="attachments" hidden></div>
    <div class="input-row">
      <textarea id="input" rows="3" aria-label="Message à Claude" aria-autocomplete="list" aria-controls="slash" placeholder="Demander à Claude… (@ pour un fichier, / pour une commande, Ctrl+V pour une image)"></textarea>
      <div class="input-buttons">
        <button id="send" title="Envoyer (Entrée)" aria-label="Envoyer" data-icon="send"></button>
        <button id="attach" class="icon" title="Joindre une image" aria-label="Joindre une image" data-icon="image"></button>
      </div>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </div>
    <div id="usage" hidden></div>
    <div class="context-row">
      <button id="selection" class="chip" title="Joindre la sélection de l'éditeur" hidden></button>
      <button id="autoFormat" class="chip off" title="Mettre en forme (Ctrl+K Ctrl+D) chaque fichier modifié par Claude" data-icon="sparkle">Format auto</button>
      <button id="autoAnalyze" class="chip" title="Quand le débogueur s'arrête sur une exception, demander l'analyse à Claude" data-icon="bolt">Exceptions</button>
      <span id="cwd"></span>
    </div>
  </footer>

  <script src="lib/marked.umd.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/mermaid.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
